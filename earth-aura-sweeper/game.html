    <script>
      // The loading bar (src/boot.css): the game reports real steps through window.__boot (src/platform/boot.ts); between them the
      // bar creeps slowly so it never looks stuck, but never past the next step by much. done() runs it to the end, then fades.
      (() => {
        const boot = document.getElementById('boot');
        const percent = boot.querySelector('.percent');
        const marks = [...boot.querySelectorAll('[data-at]')];
        let target = 0.04, creep = 0.04, shown = 0, last = performance.now(), finished = null;
        const tick = (now) => {
          const dt = Math.min(0.1, (now - last) / 1000);
          last = now;
          creep = Math.min(Math.max(creep, target) + dt * 0.012, finished ? 1 : Math.min(0.96, target + 0.12));
          const goal = finished ? 1 : Math.max(target, creep);
          shown += (goal - shown) * Math.min(1, dt * (finished ? 7 : 3));
          boot.style.setProperty('--p', shown.toFixed(4));
          const whole = Math.floor(shown * 100 + (finished ? 0.5 : 0));
          percent.textContent = whole + '%';
          boot.setAttribute('aria-valuenow', String(whole));
          for (const mark of marks) if (shown >= +mark.dataset.at) mark.classList.add('got');
          if (finished && shown > 0.995) return finished();
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        window.__boot = {
          set: (progress) => { target = Math.max(target, Math.min(0.97, progress)); },
          done: (then) => { finished = then; },
        };
      })();
    </script>
