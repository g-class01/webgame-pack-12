  <script>
      // Startup trace. Marks always go to the console: Poki playtests keep it from the first second,
      // and the engine's log/warn are silent in release builds. ?loadDebug=1 adds the resource and long-task report.
      (function () {
          const debug = new URLSearchParams(location.search).get('loadDebug') === '1';

          // The default 250 entries run out before the scene loads; the boot watchdog counts downloads here too.
          performance.setResourceTimingBufferSize?.(3000);
          const longTasks = [];
          let observer = null;
          if (debug && window.PerformanceObserver) {
              try {
                  observer = new PerformanceObserver((list) => {
                      for (const task of list.getEntries()) {
                          if (longTasks.length < 500) longTasks.push({ start: task.startTime, duration: task.duration });
                      }
                  });
                  observer.observe({ type: 'longtask', buffered: true });
              } catch (_) { /* Long Task API is optional. */ }
          }

          let reportScheduled = false;
          const trace = window.__loadTrace = {
              now: () => performance.now(),
              mark(name, details) {
                  const extra = details === undefined ? '' : ` ${JSON.stringify(details)}`;
                  console.info(`[Boot] +${performance.now().toFixed(0)}ms ${name}${extra}`);
              },
              span(name, start, details) {
                  if (typeof start !== 'number') return;
                  const extra = details === undefined ? '' : ` ${JSON.stringify(details)}`;
                  const end = performance.now();
                  console.info(`[Boot] +${end.toFixed(0)}ms ${name}: ${(end - start).toFixed(0)}ms${extra}`);
              },
              report() {
                  if (!debug) return;
                  observer?.disconnect();
                  const nav = performance.getEntriesByType('navigation')[0];
                  if (nav) {
                      console.info(`[LoadDebug] navigation: response=${nav.responseEnd.toFixed(0)}ms DOM=${nav.domContentLoadedEventEnd.toFixed(0)}ms load=${nav.loadEventEnd.toFixed(0)}ms`);
                  }
                  const resources = performance.getEntriesByType('resource');
                  const transferKB = Math.round(resources.reduce((sum, item) => sum + (item.transferSize || 0), 0) / 1024);
                  console.info(`[LoadDebug] resources: ${resources.length}, transferred=${transferKB}KB (cache/cross-origin may report 0)`);
                  const gameResources = resources.filter((item) =>
                      ['/assets/', '/scene/', '/scripting/', '/engine_external/'].some((part) => item.name.includes(part)));
                  const bucketMs = 5000;
                  const buckets = Array.from({ length: Math.ceil(performance.now() / bucketMs) }, () =>
                      ({ started: 0, finished: 0, longTaskMs: 0 }));
                  for (const item of gameResources) {
                      const end = item.responseEnd || item.startTime + item.duration;
                      const startBucket = Math.floor(item.startTime / bucketMs);
                      const endBucket = Math.floor(end / bucketMs);
                      if (buckets[startBucket]) buckets[startBucket].started++;
                      if (buckets[endBucket]) buckets[endBucket].finished++;
                  }
                  for (const task of longTasks) {
                      const bucket = buckets[Math.floor(task.start / bucketMs)];
                      if (bucket) bucket.longTaskMs += task.duration;
                  }
                  buckets.forEach((bucket, index) => {
                      console.info(`[LoadDebug] ${index * 5}-${(index + 1) * 5}s: game requests started=${bucket.started} finished=${bucket.finished}, long tasks=${bucket.longTaskMs.toFixed(0)}ms`);
                  });
                  console.info(`[LoadDebug] long tasks: count=${longTasks.length}, total=${longTasks.reduce((sum, task) => sum + task.duration, 0).toFixed(0)}ms`);
                  const label = (item) => item.name.replace(location.origin, '');
                  for (const item of [...gameResources].sort((a, b) => b.responseEnd - a.responseEnd).slice(0, 8)) {
                      console.info(`[LoadDebug] last game resource: +${item.responseEnd.toFixed(0)}ms ${item.duration.toFixed(0)}ms ${label(item)}`);
                  }
                  for (const item of [...resources].sort((a, b) => b.duration - a.duration).slice(0, 8)) {
                      console.info(`[LoadDebug] slow resource: +${item.startTime.toFixed(0)}ms ${item.duration.toFixed(0)}ms ${Math.round((item.transferSize || 0) / 1024)}KB ${label(item)}`);
                  }
                  for (const item of [...resources].sort((a, b) => (b.decodedBodySize || 0) - (a.decodedBodySize || 0)).slice(0, 5)) {
                      console.info(`[LoadDebug] large resource: +${item.startTime.toFixed(0)}ms ${Math.round((item.decodedBodySize || 0) / 1024)}KB ${item.duration.toFixed(0)}ms ${label(item)}`);
                  }
                  for (const task of [...longTasks].sort((a, b) => b.duration - a.duration).slice(0, 8)) {
                      console.info(`[LoadDebug] long task: +${task.start.toFixed(0)}ms duration=${task.duration.toFixed(0)}ms`);
                  }
              },
              scheduleReport(delay = 5000) {
                  if (!debug || reportScheduled) return;
                  reportScheduled = true;
                  setTimeout(() => trace.report(), delay);
              },
          };
          trace.mark('HTML head');
          document.addEventListener('DOMContentLoaded', () => trace.mark('DOM ready'));
          window.addEventListener('load', () => trace.mark('window load'));
          if (debug) setTimeout(() => { if (!reportScheduled) trace.report(); }, 30000);
      })();
  </script>

<script>
  (function () {
    // Turn this off to compare the clean baseline with and without the input compatibility fix.
    var allowCanvasKeyboardBubbling = true;
    if (allowCanvasKeyboardBubbling) {
      window.addEventListener('keydown', function (event) {
        var canvas = document.getElementById('GameCanvas');
        if (!canvas || event.target !== canvas || !event.isTrusted) return;

        // Cocos stops native keydown on the canvas; Poki observes it on document in the bubble phase.
        // Keep the original trusted event and its default prevention, allowing it past the canvas.
        var ownStop = Object.getOwnPropertyDescriptor(event, 'stopPropagation');
        var originalStop = event.stopPropagation;
        function stopOutsideCanvas() {
          if (this.currentTarget !== canvas) originalStop.call(this);
        }
        try {
          Object.defineProperty(event, 'stopPropagation', {
            configurable: true, writable: true, value: stopOutsideCanvas
          });
        } catch (_) { return; }

        // A microtask can run between native event listeners; restore only after the dispatch task.
        setTimeout(function () {
          if (event.stopPropagation !== stopOutsideCanvas) return;
          if (ownStop) Object.defineProperty(event, 'stopPropagation', ownStop);
          else delete event.stopPropagation;
        }, 0);
      }, true);
    }

    var pokiInitPromise;
    try {
      if (!window.PokiSDK || typeof PokiSDK.init !== 'function') {
        pokiInitPromise = Promise.resolve(false);
      } else {
        pokiInitPromise = Promise.resolve(PokiSDK.init()).then(
          function () { console.log("Poki SDK successfully initialized"); return true; },
          function () { console.log("Initialized, but the user likely has adblock"); return false; }
        );
      }
    } catch (error) {
      console.log("Initialized, but the user likely has adblock");
      pokiInitPromise = Promise.resolve(false);
    }
    // PokiPlatform.ts sends measure events only after this resolves true; WebPlatform hides ads when it is false.
    window.__pokiInitPromise = pokiInitPromise;

    // Adblock may remove the SDK entirely: every page-level call checks the method first.
    function call(name, args) {
      var sdk = window.PokiSDK;
      if (sdk && typeof sdk[name] === 'function') return sdk[name].apply(sdk, args || []);
    }

    window.__dnaDiversPlatform = {
      id: 'poki',
      sdk: 'poki',
      ready: pokiInitPromise.then(function () {}),
      setDebug: function (debug) { call('setDebug', [debug]); },
      loadingStart: function () { call('gameLoadingStart'); },
      loadingFinished: function () { call('gameLoadingFinished'); }
    };
  })();
</script>

  <script>
  // Boot watchdog. Runs after the platform SDK, so Poki playtests capture every line.
  // While the loader is up (and a few ticks after) logs the engine state every 2 s: where loading stalls,
  // whether frames are drawn, whether the WebGL context survives. Cocos 3.8 never rebuilds a lost context: the canvas stays black.
  (function () {
    var TICK_MS = 2000;
    var STOP_AT_MS = 120000;  // page time: no ticks past this even if the loader is still up
    var TICKS_AFTER_LOADER = 5;
    var MAX_ERRORS = 20;

    var errors = 0;
    var contextLost = false;
    var gfxLogged = false;
    var ticksAfterLoader = 0;
    var lastFrames = 0;
    var lastAt = performance.now();

    function out(level, message) {
      console[level]('[Boot] +' + performance.now().toFixed(0) + 'ms ' + message);
    }
    function cut(text, max) {
      text = String(text);
      return text.length > max ? text.slice(0, max) + '...' : text;
    }
    function mb(bytes) {
      return Math.round((bytes || 0) / 1048576) + 'MB';
    }

    out('info', 'device mem=' + (navigator.deviceMemory || '?') + 'GB cores=' + (navigator.hardwareConcurrency || '?')
      + ' screen=' + screen.width + 'x' + screen.height + ' view=' + innerWidth + 'x' + innerHeight + ' dpr=' + devicePixelRatio);
    out('info', 'ua ' + navigator.userAgent);

    // Capture phase: failed <script>/<img> loads and WebGL context events do not bubble.
    window.addEventListener('error', function (e) {
      if (errors >= MAX_ERRORS) return;
      errors++;
      var target = e.target;
      if (target && target !== window && (target.src || target.href)) {
        out('error', 'resource failed: ' + (target.src || target.href));
        return;
      }
      var stack = e.error && e.error.stack ? ' | ' + e.error.stack : '';
      out('error', cut('error: ' + e.message + ' @ ' + (e.filename || '?') + ':' + e.lineno + ':' + e.colno + stack, 800));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      if (errors >= MAX_ERRORS) return;
      errors++;
      var reason = e.reason;
      out('error', cut('unhandled rejection: ' + ((reason && (reason.stack || reason.message)) || reason), 800));
    });
    window.addEventListener('webglcontextcreationerror', function (e) {
      out('error', 'WebGL context creation failed: ' + (e.statusMessage || '?'));
    }, true);
    window.addEventListener('webglcontextlost', function (e) {
      contextLost = true;
      out('warn', 'WebGL context lost' + (e.statusMessage ? ': ' + e.statusMessage : ''));
    }, true);
    window.addEventListener('webglcontextrestored', function () {
      out('warn', 'WebGL context restored (the engine does not rebuild GPU resources)');
    }, true);

    function tick() {
      var now = performance.now();
      var cc = window.cc;
      var director = cc && cc.director;
      var device = director && director.root && director.root.device;
      if (device && !gfxLogged) {
        gfxLogged = true;
        var api = cc.gfx && cc.gfx.API ? cc.gfx.API[device.gfxAPI] : device.gfxAPI;
        out('info', 'gfx ' + api + ' renderer="' + device.renderer + '" vendor="' + device.vendor + '"');
      }
      var gl = device && device.gl;
      if (gl && gl.isContextLost && gl.isContextLost()) contextLost = true;

      var frames = director && director.getTotalFrames ? director.getTotalFrames() : 0;
      var fps = (frames - lastFrames) * 1000 / Math.max(1, now - lastAt);
      lastFrames = frames;
      lastAt = now;
      var resources = performance.getEntriesByType('resource');
      var bytes = 0;
      for (var i = 0; i < resources.length; i++) bytes += resources[i].transferSize || 0;
      var canvas = document.getElementById('GameCanvas');
      var loader = document.getElementById('GameLoader');
      var loaderShown = !!loader && !loader.classList.contains('is-hidden');

      var line = 'tick engine=' + (device ? 'gfx' : cc ? 'js' : 'none')
        + ' scene=' + (director && director.getScene && director.getScene() ? 'yes' : 'no')
        + ' frames=' + frames + ' fps=' + fps.toFixed(0);
      if (device) {
        var memory = device.memoryStatus || {};
        line += ' draws=' + device.numDrawCalls + ' gpu=' + mb(memory.textureSize) + '+' + mb(memory.bufferSize);
      }
      line += ' canvas=' + (canvas ? canvas.width + 'x' + canvas.height : '?')
        + ' net=' + resources.length + '/' + mb(bytes)
        + ' heap=' + (performance.memory ? mb(performance.memory.usedJSHeapSize) : '?')
        + ' loader=' + (loaderShown ? 'shown' : 'hidden')
        + (document.hidden ? ' page-hidden' : '')
        + (contextLost ? ' CONTEXT-LOST' : '');
      out(contextLost ? 'warn' : 'info', line);

      if (!loaderShown) ticksAfterLoader++;
      if (ticksAfterLoader >= TICKS_AFTER_LOADER || now >= STOP_AT_MS) {
        clearInterval(timer);
        out('info', 'watchdog stop' + (loaderShown ? ', loader still shown' : ''));
      }
    }

    var timer = setInterval(function () {
      try { tick(); } catch (e) { clearInterval(timer); out('warn', 'watchdog failed: ' + e); }
    }, TICK_MS);
  })();
  </script>

  <script>
  // ===================== управление загрузчиком =====================
  (function () {
    var AUTO_HIDE_ON_SCENE = true;   // сцена загрузилась; ждём прогрева рендера
    var SAFETY_AFTER_SCENE = 15000;  // мс после появления сцены: прогрев так и не сообщил о готовности
    var SAFETY_TIMEOUT     = 120000; // мс, аварийный предел — экран не залипнет навсегда
    var FADE_MS            = 400;    // должно совпадать с transition в CSS

    var el = document.getElementById('GameLoader');
    var hidden = false;
    var poll = null;
    var sceneStarted = false;
    var sdkFinished = false;
    var visualReady = false;
    var platform = window.__dnaDiversPlatform;
    var needsCrazyGamesReady = platform && platform.id === 'crazygames';
    function platformAllowsHide() {
      return !needsCrazyGamesReady ||
        (platform.settled === true && platform.failed !== true && visualReady);
    }

    function hide (reason) {
      if (hidden || !el || !platformAllowsHide()) return;
      hidden = true;
      if (poll) { clearInterval(poll); poll = null; }
      window.__loadTrace?.mark('loader hidden', { reason: reason || 'manual' });
      window.__loadTrace?.scheduleReport(2000);
      el.classList.add('is-hidden');
      setTimeout(function () { el.classList.add('is-gone'); }, FADE_MS);
    }

    function show () {
      if (!el) return;
      hidden = false;
      el.classList.remove('is-gone');
      requestAnimationFrame(function () { el.classList.remove('is-hidden'); });
    }

    var sceneSafety = null;
    function hideWhenReady () {
      if (visualReady && (sceneStarted || sdkFinished)) { hide('ready'); return; }
      // Пока сцены нет, показывать нечего: под экраном только пустой canvas. Медленная загрузка
      // (CDN портала, SDK) не должна открывать его раньше времени.
      if ((sceneStarted || sdkFinished) && !sceneSafety) {
        sceneSafety = setTimeout(function () {
          sceneSafety = null;
          hide('safety timeout after scene');
        }, SAFETY_AFTER_SCENE);
      }
    }

    // Ручное управление из игры: window.hideGameLoader() / window.showGameLoader()
    window.hideGameLoader = hide;
    window.showGameLoader = show;
    window.markGameVisualReady = function () {
      visualReady = true;
      window.__loadTrace?.mark('visual ready');
      hideWhenReady();
    };

    // 1) платформа получает сигнал загрузки; экран остаётся до прогрева теней
    if (platform && typeof platform.loadingFinished === 'function') {
      var origFinished = platform.loadingFinished;
      platform.loadingFinished = function () {
        sdkFinished = true;
        window.__loadTrace?.mark('platform.loadingFinished', { platform: platform.id });
        hideWhenReady();
        return origFinished.apply(platform, arguments);
      };
    }
    if (needsCrazyGamesReady && platform.ready && typeof platform.ready.then === 'function') {
      platform.ready.then(function () {
        sdkFinished = true;
        window.__loadTrace?.mark('platform ready', { platform: platform.id });
        hideWhenReady();
      });
    }

    // 2) запасной признак готовности сцены
    if (AUTO_HIDE_ON_SCENE) {
      poll = setInterval(function () {
        try {
          if (window.cc && cc.director && cc.director.getScene && cc.director.getScene()) {
            clearInterval(poll);
            poll = null;
            sceneStarted = true;
            window.__loadTrace?.mark('scene available');
            hideWhenReady();
          }
        } catch (e) { /* движок ещё не готов */ }
      }, 100);
    }

    // 3) страховка
    setTimeout(function () { hide('safety timeout'); }, SAFETY_TIMEOUT);
  })();
